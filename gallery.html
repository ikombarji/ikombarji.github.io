        <!--
            HOW TO EDIT THIS PAGE
            Each photo is one <figure> block below.
            - To swap a photo: replace the file in images/gallery/ (keep the same name),
              or change the file name in src="..." to match your new file.
            - To add a photo: copy one <figure> block and paste it below the last one.
            - To remove a photo: delete its <figure> block.
            - Each <figure> is marked class="portrait" (taller than wide) or class="landscape"
              (wider than tall). Both follow repeating size patterns (see css/style.css), with
              portrait photos kept above a minimum size, so adding or removing a photo shifts the
              sizes of the ones after it. When you add a photo, give its <figure> the right
              class. To force a size, add small / medium / large, e.g. <figure class="landscape small">.
            - The text inside alt="..." describes the photo (helps accessibility).
        -->
